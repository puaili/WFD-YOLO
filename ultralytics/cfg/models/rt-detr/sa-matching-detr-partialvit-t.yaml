# Paper-driven SA-Matching DETR full-model reproduction for OSI26.
#
# Values stated by the paper:
# - Partial ViT-T backbone mechanism (partial-channel attention, all tokens retained)
# - full encoder-decoder model, three decoder layers, 900 object queries
# - SA-Matching factors (s, m, l) = (1, 7, 9)
#
# The official code/model is not public as of 2026-08-11. The paper does not
# publish a complete per-layer Partial ViT-T table, so the Tiny reconstruction
# uses the DeiT-T design budget (C=192, depth=12, heads=3, MLP ratio=4) and a
# 0.5 active-channel ratio, which reproduces the reported ~4.6M backbone scale.

nc: 26
sa_matching:
  s: 1
  m: 7
  l: 9
  eta_s: 0.0025   # (32 / 640)^2
  eta_l: 0.0225   # (96 / 640)^2

backbone:
  # Single-resolution Partial ViT-T at P4/16, as described in Sec. 3.3.
  - [-1, 1, PartialPatchEmbed, [192, 16]]            # 0 patch embedding, 40x40 at 640
  - [-1, 12, PartialViTBlock, [0.5, 3, 4.0, 0.0]] # 1 Partial ViT-T blocks
  - [-1, 1, ChannelLayerNorm2d, []]                # 2 normalized P4/16, 192 channels

  # Derive a multi-scale feature pyramid from the final single-resolution map.
  - [-1, 1, nn.Upsample, [None, 2, "bilinear"]]   # 3 P3/8
  - [-1, 1, Conv, [128, 3, 1]]                     # 4 P3/8, 128 channels
  - [2, 1, Conv, [384, 3, 2]]                      # 5 P5/32, 384 channels

head:
  # Transformer encoder and hybrid multi-scale fusion.
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 6 P5 projection
  - [-1, 1, AIFI, [1024, 8]]                      # 7 standard transformer encoder
  - [-1, 1, Conv, [256, 1, 1]]                    # 8 Y5

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [2, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 10 P4 projection
  - [[-2, -1], 1, Concat, [1]]                    # 11
  - [-1, 3, RepC3, [256]]                         # 12 FPN P4
  - [-1, 1, Conv, [256, 1, 1]]                    # 13 Y4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 15 P3 projection
  - [[-2, -1], 1, Concat, [1]]                    # 16
  - [-1, 3, RepC3, [256]]                         # 17 FPN P3

  - [-1, 1, Conv, [256, 3, 2]]                    # 18
  - [[-1, 13], 1, Concat, [1]]                    # 19
  - [-1, 3, RepC3, [256]]                         # 20 PAN P4

  - [-1, 1, Conv, [256, 3, 2]]                    # 21
  - [[-1, 8], 1, Concat, [1]]                     # 22
  - [-1, 3, RepC3, [256]]                         # 23 PAN P5

  # Full model: 900 queries and three deformable decoder layers.
  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 900, 4, 8, 3, 1024, 0.0]]
